<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>frus playground preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #121418; overflow: hidden; }
      /* winit appends its canvas to <body>; it fills the frame. The minimum size frus asks of a
         window would otherwise hold it wider than a phone's frame, and cut its edge off. */
      canvas { display: block; width: 100vw; height: 100vh; min-width: 0 !important; min-height: 0 !important; }
      #status {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        padding: 24px; text-align: center; color: #e6e6ef; font: 15px/1.5 system-ui, sans-serif;
      }
      #status[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="status" role="status" aria-live="polite">Loading frus…</div>

    <!-- Talks to the page around it: receives { type: 'hello' | 'source', code }, and answers with
         { type: 'ready' | 'result' | 'late-error' | 'crashed' | 'unsupported' }. -->
    <script type="module">
      const status = document.getElementById('status');
      const say = (message) => parent.postMessage(message, location.origin);
      // What this frame has last told the page, repeated if the page was not listening yet.
      let state = null;
      const announce = (message) => {
        state = message;
        say(message);
      };
      addEventListener('message', (event) => {
        if (event.source === parent && event.data?.type === 'hello' && state) say(state);
      });
      const fail = (text, type) => {
        status.hidden = false;
        status.textContent = text;
        announce({type, message: text});
      };
      // The folder of this page, whichever way the server spells its address.
      const folder = location.pathname.replace(/index\.html$/, '').replace(/\/?$/, '/');
      const decode = (encoded) => {
        const [line, column, ...message] = encoded.split(':');
        return {line: +line, column: +column, message: message.join(':')};
      };

      // The wasm is several megabytes: on a slow line it takes a minute, so say how far it got.
      // The server may send it compressed, and then its length says nothing of the bytes the
      // stream yields: the build writes the real size on <body> (data-wasm-bytes) when it knows.
      const download = async (url) => {
        const response = await fetch(url);
        if (!response.ok || !response.body) return response;
        const total = +document.body.dataset.wasmBytes ||
          (response.headers.get('content-encoding') ? 0 : +response.headers.get('content-length'));
        const reader = response.body.getReader();
        const chunks = [];
        let received = 0;
        let shown = 0;
        const mb = (bytes) => (bytes / 1e6).toFixed(1);
        for (;;) {
          const {done, value} = await reader.read();
          if (done) break;
          chunks.push(value);
          received += value.length;
          const now = performance.now();
          if (now - shown > 500) {
            shown = now;
            status.textContent = total
              ? `Loading frus… ${Math.min(99, Math.floor((received / total) * 100))}%`
              : `Loading frus… ${mb(received)} MB`;
          }
        }
        status.textContent = 'Starting frus…';
        const bytes = new Uint8Array(received);
        let at = 0;
        for (const chunk of chunks) {
          bytes.set(chunk, at);
          at += chunk.length;
        }
        return bytes;
      };

      window.playgroundPanicked =(message) => say({type: 'crashed', message});

      // `navigator.gpu` alone promises nothing: a browser can have it, and no adapter behind it.
      // frus would then log an error and leave the frame blank.
      const adapter = 'gpu' in navigator ? await navigator.gpu.requestAdapter().catch(() => null) : null;
      if (!adapter) {
        fail('The preview draws through WebGPU, which is not available here. ' +
             'Try a recent Chrome, Edge or Firefox, with hardware acceleration on.', 'unsupported');
      } else {
        try {
          const app = await import(`${folder}pkg/frus_playground.js`);
          await app.default({module_or_path: await download(`${folder}pkg/frus_playground_bg.wasm`)});
          app.install_panic_report();
          status.hidden = true;

          addEventListener('message', (event) => {
            if (event.source !== parent || event.data?.type !== 'source') return;
            const start = performance.now();
            const answer = app.set_source(event.data.code);
            // The time to the frame that shows it: this frame's callback, then the next.
            requestAnimationFrame(() => requestAnimationFrame(() => {
              say({
                type: 'result',
                id: event.data.id,
                error: answer ? decode(answer) : null,
                ms: performance.now() - start,
              });
            }));
          });
          setInterval(() => {
            const late = app.take_late_error();
            if (late) say({type: 'late-error', error: decode(late)});
          }, 200);
          announce({type: 'ready'});
        } catch (err) {
          fail('The preview could not start: ' + err, 'unsupported');
        }
      }
    </script>
  </body>
</html>
