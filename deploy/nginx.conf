# Serves the built site. TLS is the proxy's in front of this (Coolify's Traefik).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docusaurus writes `page/index.html`; a few pages are `page.html`. Serve the index straight
    # away: nginx's own slash redirect is absolute and names the container's port and scheme,
    # which sends https visitors behind the proxy to plain http.
    absolute_redirect off;
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
    error_page 404 /404.html;

    # Hashed assets never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # The playground's wasm and glue keep their name across builds: check each time.
    location /playground-app/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # nginx's own mime.types already maps .wasm to application/wasm; a `types` block here would
    # replace that whole table.
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
}
