# Serves the built site. TLS is the proxy's in front of this (Coolify's Traefik).

# `.br` when the browser takes brotli: the build writes one beside each large file
# (scripts/precompress.mjs).
map $http_accept_encoding $br_suffix {
    default "";
    "~*\bbr\b" ".br";
}
map $br_suffix $br_encoding {
    default "";
    ".br" "br";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Files compressed at build time, at the strongest settings, before fast on-the-fly gzip.
    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Docusaurus writes `page/index.html`; a few pages are `page.html`. Serve the index straight
    # away: nginx's own slash redirect is absolute and names the container's port and scheme,
    # which sends https visitors behind the proxy to plain http.
    absolute_redirect off;
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
    error_page 404 /404.html;

    # Hashed assets never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The playground's wasm and glue keep their name across builds: check each time. They are
    # most of a first visit, so brotli when the browser takes it. nginx's own mime.types maps
    # .wasm; the `.br` beside each file has no type of its own, so each location names it.
    location /playground-app/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }
    location ~ ^/playground-app/.+\.wasm$ {
        gzip off;
        types { }
        default_type application/wasm;
        add_header Cache-Control "no-cache";
        add_header Content-Encoding $br_encoding;
        add_header Vary "Accept-Encoding";
        try_files $uri$br_suffix $uri =404;
    }
    location ~ ^/playground-app/.+\.js$ {
        gzip off;
        types { }
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header Content-Encoding $br_encoding;
        add_header Vary "Accept-Encoding";
        try_files $uri$br_suffix $uri =404;
    }
}
